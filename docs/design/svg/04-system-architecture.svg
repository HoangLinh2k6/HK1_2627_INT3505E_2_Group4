<text x="55.0" y="1119.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526277">Vite proxy phát triển: /api hoặc /api/v1 → backend, bỏ prefix. Backend hiện khai báo /auth, /venues, /courts...</text>
<text x="55.0" y="1148.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526277">Nét đứt đánh dấu luồng auth còn cần tích hợp. Sơ đồ thể hiện cấu trúc mã; tích hợp runtime cần kiểm thử tiếp.</text>
