<text x="1161.0" y="698.8" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#155e75">bookings</text>
<text x="1161.0" y="753.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">PK id : BIGINT</text>
<text x="1161.0" y="787.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">FK user_id → users</text>
<text x="1161.0" y="821.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">FK court_id → courts</text>
<text x="1161.0" y="855.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">start_time, end_time</text>
<text x="1161.0" y="889.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">total_price : DECIMAL(12,2)</text>
<text x="1161.0" y="923.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">status, expires_at</text>
<text x="1161.0" y="957.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">request_key : VARCHAR(64)</text>
<text x="1161.0" y="991.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">checked_in_at, checked_out_at</text>
