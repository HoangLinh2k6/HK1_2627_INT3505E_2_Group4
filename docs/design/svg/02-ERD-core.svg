<text x="616.0" y="753.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">PK id : BIGINT</text>
<text x="616.0" y="787.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">FK venue_id → venues</text>
<text x="616.0" y="821.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">FK sport_type_id → sport_types</text>
