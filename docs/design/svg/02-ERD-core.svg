<text x="616.0" y="288.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">PK id : BIGINT</text>
<text x="616.0" y="322.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">FK owner_id → users</text>
<text x="616.0" y="356.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">name, address, district, city</text>
<text x="616.0" y="390.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">open_time, close_time : TIME</text>
<text x="616.0" y="424.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">description, status</text>
