<text x="616.0" y="1173.8" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#155e75">reviews</text>
<text x="616.0" y="1228.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">PK id : BIGINT</text>
<text x="616.0" y="1262.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">FK venue_id, user_id</text>
<text x="616.0" y="1296.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">FK/UK booking_id → bookings</text>
<text x="616.0" y="1330.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">rating, comment, created_at</text>
<polyline points="55,1406 1545,1406" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<text x="55.0" y="1440.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526277">bookings có UNIQUE(user_id, request_key) và index (court_id, start_time, end_time).</text>
<text x="55.0" y="1469.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526277">Quan hệ 1 — 0..* cho phép phía nhiều chưa có bản ghi; mỗi bản ghi con có đúng một bản ghi cha.</text>
<text x="55.0" y="1498.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526277">Review có FK riêng đến User và Venue; ứng dụng kiểm tra chúng khớp với Booking. Giờ nghiệp vụ theo Việt Nam.</text>
