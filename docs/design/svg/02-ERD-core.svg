<text x="71.0" y="787.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">FK user_id → users</text>
<text x="71.0" y="821.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">UK access_hash : VARCHAR(64)</text>
