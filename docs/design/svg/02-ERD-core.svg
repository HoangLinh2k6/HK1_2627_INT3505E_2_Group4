<text x="71.0" y="1173.8" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#155e75">payments</text>
<text x="71.0" y="1228.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">PK id : BIGINT</text>
<text x="71.0" y="1262.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">FK booking_id → bookings</text>
<text x="71.0" y="1296.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">amount : DECIMAL(12,2)</text>
