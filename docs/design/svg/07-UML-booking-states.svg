<text x="55.0" y="1139.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526277">Scheduler cập nhật PENDING → EXPIRED khi expiresAt ≤ now hoặc startTime ≤ now; mặc định kiểm tra mỗi 60 giây.</text>
<text x="55.0" y="1168.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526277">check-in giữ nguyên CONFIRMED. Thanh toán có dữ liệu riêng; không thêm trạng thái PAID vào Booking.</text>
