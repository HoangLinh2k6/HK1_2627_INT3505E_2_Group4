<text x="55.0" y="106.5" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#203044">ERD dịch vụ bổ sung và thuê dụng cụ</text>
<text x="55.0" y="143.3" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526277">Các bảng đã xuất hiện trong backend • liên kết với venues và bookings của ERD cốt lõi.</text>
