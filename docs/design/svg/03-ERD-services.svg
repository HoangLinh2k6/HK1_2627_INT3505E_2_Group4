<text x="1161.0" y="1073.8" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#155e75">rental_photos</text>
<text x="1161.0" y="1128.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">PK id; FK rental_id</text>
<text x="1161.0" y="1162.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">phase, angle, content_type</text>
<text x="1161.0" y="1196.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">cloudinary_public_id</text>
<text x="1161.0" y="1230.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">content_sha256, uploaded_at</text>
<text x="1161.0" y="1264.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">image : MEDIUMBLOB (legacy)</text>
<rect x="55" y="1035" width="945" height="170" rx="10" fill="#f4f6f8" stroke="#64748b" stroke-width="2"/>
<text x="73.0" y="1071.8" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#155e75">Ràng buộc và lưu vết</text>
<text x="73.0" y="1111.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">addon_orders có UNIQUE(booking_id, request_key).</text>
<text x="73.0" y="1144.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">rental_photos có UNIQUE(rental_id, phase, angle).</text>
<text x="73.0" y="1177.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">delivered_by và returned_by là ID lưu vết; entity hiện dùng Long.</text>
<polyline points="55,1335 1545,1335" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<text x="55.0" y="1369.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526277">kind: CONSUMABLE hoặc RENTAL. phase: CHECK_IN / CHECK_OUT. angle: OVERVIEW / DETAIL.</text>
<text x="55.0" y="1398.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526277">Mỗi lượt thuê có tối đa một ảnh được lưu cho từng cặp phase / angle, theo ràng buộc duy nhất của bảng.</text>
