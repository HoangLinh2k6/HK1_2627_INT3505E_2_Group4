<text x="1161.0" y="738.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">PK id; FK order_id, asset_id</text>
<text x="1161.0" y="772.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">handed_out_at, returned_at</text>
