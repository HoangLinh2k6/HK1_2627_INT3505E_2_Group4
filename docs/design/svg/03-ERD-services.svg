<text x="616.0" y="806.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">quantity, unit_price</text>
<text x="616.0" y="840.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">ordered_at, cancelled_at</text>
<text x="616.0" y="874.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">delivered_at, delivered_by</text>
