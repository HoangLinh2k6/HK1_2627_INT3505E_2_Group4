<text x="1161.0" y="288.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">PK id; FK venue_id, addon_id</text>
<text x="1161.0" y="322.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">code, state</text>
<text x="1161.0" y="356.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">UK (venue_id, code)</text>
