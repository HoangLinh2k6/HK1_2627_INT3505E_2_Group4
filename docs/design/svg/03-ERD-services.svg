<text x="1161.0" y="840.1" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#203044">UK (order_id, asset_id)</text>
<rect x="1145" y="1040" width="400" height="240" rx="10" fill="white" stroke="#64748b" stroke-width="2"/>
