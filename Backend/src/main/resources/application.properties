# Fill your MySQL connection details below (lines 2-5), or pass them as environment variables.
DB_HOST=dien_db_host_vao_day
DB_PORT=dien_db_port_vao_day
DB_USER=dien_db_user_vao_day
DB_PASSWORD=dien_db_pass_vao_day

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/defaultdb?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.serialization.fail-on-empty-beans=false
server.port=8080
