      description: Lấy user từ phiên, tính lại tổng giá ở backend. Khóa Court để kiểm tra xung đột trong
        transaction. PENDING giữ chỗ đến min(now+30 phút, startTime). Đổi Idempotency-Key khi thử yêu cầu mới
        trùng giờ để thấy 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9._:-]{1,64}$
          example: booking-demo-001
          description: Tùy chọn. Cùng CUSTOMER và key, cùng sân/giờ sẽ trả lại booking cũ với 201. Khác nội dung trả 409.
