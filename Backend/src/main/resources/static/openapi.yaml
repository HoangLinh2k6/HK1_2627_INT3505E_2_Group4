          $ref: "#/components/schemas/Id"
        phase:
          $ref: "#/components/schemas/PhotoPhase"
        angle:
          $ref: "#/components/schemas/PhotoAngle"
        uploadedAt:
          $ref: "#/components/schemas/LocalTime"
      description: Metadata ảnh. Tải nội dung ảnh hoặc link ký có thời hạn qua endpoint riêng.
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Tên trường JSON, query parameter, path variable, header hoặc multipart field bị lỗi.
          example: email
        code:
          type: string
          description: Mã lỗi chi tiết của trường (ví dụ NotBlank, Email, Pattern, Size, Min, Max, TYPE_MISMATCH, INVALID_ENUM, MISSING_PARAMETER, MISSING_HEADER).
          example: Email
        message:
          type: string
          description: Mô tả cụ thể lý do trường không hợp lệ.
          example: Email must be a valid email address.
        rejectedValue:
          type:
            - string
            - number
            - boolean
            - "null"
          description: Giá trị bị từ chối (ẩn với các trường nhạy cảm như password, token, secret).
          example: invalid-email
    ApiError:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - timestamp
      properties:
        type:
          type: string
          format: uri-reference
          description: URI định danh loại lỗi theo chuẩn RFC 9457 dạng urn:keosan:problem:<code-kebab-case>.
          example: urn:keosan:problem:validation-error
        title:
          type: string
          description: Tên ngắn gọn theo mã trạng thái HTTP.
          example: Bad Request
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Mã trạng thái HTTP.
          example: 400
        detail:
          type: string
          description: Mô tả chi tiết, cụ thể nguyên nhân lỗi và cách khắc phục.
          example: "Validation failed for 2 field(s): email, phone."
        instance:
          type: string
          description: Đường dẫn URI của request phát sinh lỗi.
          example: /api/v1/auth/register
        code:
          type: string
          description: >-
            Mã lỗi ổn định để client xử lý (ví dụ VALIDATION_ERROR, INVALID_REQUEST_BODY, INVALID_PARAMETER,
            MISSING_PARAMETER, MISSING_HEADER, MISSING_PART, AUTHENTICATION_REQUIRED, INVALID_ACCESS_TOKEN,
            INVALID_AUTH_HEADER, INVALID_CREDENTIALS, INVALID_REFRESH_SESSION, ACCESS_DENIED, ORIGIN_NOT_ALLOWED,
            RESOURCE_NOT_FOUND, ENDPOINT_NOT_FOUND, METHOD_NOT_ALLOWED, EMAIL_ALREADY_EXISTS,
            SPORT_TYPE_ALREADY_EXISTS, BOOKING_TIME_OVERLAP, BOOKING_HOLD_EXPIRED, INVALID_BOOKING_STATUS,
            BOOKING_IN_PAST, OUTSIDE_OPENING_HOURS, COURT_PRICE_NOT_CONFIGURED, IDEMPOTENCY_KEY_CONFLICT,
            INSUFFICIENT_STOCK, INSUFFICIENT_EQUIPMENT, ASSET_ID_MISMATCH, MISSING_RENTAL_PHOTOS,
            RESOURCE_IN_USE, DUPLICATE_RESOURCE, DATA_INTEGRITY_VIOLATION, PAYLOAD_TOO_LARGE,
            UNSUPPORTED_MEDIA_TYPE, UNSUPPORTED_IMAGE_TYPE, UPSTREAM_STORAGE_ERROR, STORAGE_NOT_CONFIGURED,
            INTERNAL_SERVER_ERROR).
          example: VALIDATION_ERROR
        timestamp:
          type: string
          format: date-time
          description: Thời điểm phát sinh lỗi theo ISO-8601 UTC.
          example: "2026-11-25T09:30:00Z"
        errors:
          type: array
          description: Danh sách lỗi chi tiết theo từng trường hoặc tham số (chỉ trả về khi có lỗi dữ liệu đầu vào).
          items:
            $ref: "#/components/schemas/FieldError"
      description: >-
        Định dạng lỗi thống nhất RFC 9457 (application/problem+json) do cả Spring Security và
        GlobalExceptionHandler trả về cho mọi lỗi 4xx/5xx.
      example:
        type: urn:keosan:problem:validation-error
        title: Bad Request
        status: 400
        detail: "Validation failed for 2 field(s): email, phone."
        instance: /api/v1/auth/register
        code: VALIDATION_ERROR
        timestamp: "2026-11-25T09:30:00Z"
        errors:
          - field: email
            code: Email
            message: Email must be a valid email address.
            rejectedValue: invalid-email
          - field: phone
            code: Pattern
            message: Phone number must be 10 digits starting with 0 (e.g. 0901234567).
            rejectedValue: "12345"
    LocalDateTime:
      type: string
      description: ISO local date-time theo Asia/Ho_Chi_Minh, không có offset.
      example: 2026-12-01T18:00:00
    BookingTime:
      type: string
      description: ISO date-time có offset hoặc local date-time theo giờ Việt Nam. Duration là bội 30 phút, nằm
        trong một ngày local và căn theo giờ mở cửa.
      examples:
        - 2030-01-02T17:00:00+07:00
        - 2030-01-02T17:00:00
