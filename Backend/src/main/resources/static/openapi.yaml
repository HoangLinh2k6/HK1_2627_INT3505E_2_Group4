openapi: 3.1.0
info:
  title: Đặt Sân — Backend API
  version: 1.0.0
  description: >-
    API của backend Spring Boot và MySQL trong repository Nhóm 4.


    ### Bắt đầu

    1. Dùng GET /venues và GET /venues/{venueId}/courts để chọn ID có trong cơ sở dữ liệu.

    2. Đăng ký CUSTOMER bằng POST /auth/register, sau đó POST /auth/login.

    3. Sao chép data.accessToken, bấm Authorize và nhập token vào bearerAuth.

    4. Thử availability → quote → POST /bookings với ngày trong tương lai.

    5. Đăng nhập OWNER sở hữu cơ sở để xác nhận booking.


    API sử dụng URI versioning với prefix /api/v1. Các path bên dưới được ghép với server /api/v1 trên cùng
    origin. Ví dụ đăng nhập tại /api/v1/auth/login. Vite proxy giữ nguyên prefix khi gửi tới backend.


    ID của entity là số nguyên. AuthUser trả id dạng chuỗi. Booking nhận court: {id}, startTime và endTime.
    Backend lấy user từ phiên và tự tính giá. Thời gian local được hiểu theo Asia/Ho_Chi_Minh. Response
    availability và quote dùng timestamp UTC.


    Refresh sử dụng cookie HttpOnly keosan_refresh. Khi thử trên HTTP local, đặt APP_AUTH_SECURE_COOKIE=false
    rồi khởi động lại backend để trình duyệt gửi cookie refresh. Cookie và dữ liệu đăng nhập thuộc tài khoản
    đang thử. Sau refresh cần cập nhật access token trong Authorize. Sau logout hãy bấm Logout trong Authorize
    để xóa token khỏi UI.


    OpenAPI mô tả các controller hiện có. Payment hiện tạo bản ghi trong DB. Tích hợp cổng thanh toán,
    callback và hoàn tiền thực tế vẫn là phần cần phát triển. Mọi lỗi 4xx/5xx (từ cả Spring Security và
    GlobalExceptionHandler) đều trả về định dạng RFC 9457 Problem Details (`application/problem+json`)
    thống nhất gồm `type`, `title`, `status`, `detail`, `instance`, `code`, `timestamp` và mảng `errors`
    chi tiết theo từng trường/tham số khi có lỗi dữ liệu đầu vào.


    Danh sách dùng Spring Page được đánh số từ 0. GET /venues sắp xếp ID tăng dần. Các endpoint hiện tại chưa
    nhận tham số sort tùy ý.
servers:
  - url: /api/v1
    description: Backend Đặt Sân v1 trên cùng origin
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Đăng ký CUSTOMER, đăng nhập, refresh và logout.
  - name: Users
    description: Hồ sơ của người dùng trong phiên.
  - name: Sport types
    description: Danh mục môn thể thao. ADMIN quản lý.
  - name: Venues
    description: Tìm và quản lý cơ sở. OWNER quản lý cơ sở của mình.
  - name: Courts
    description: Sân vật lý, giá, lịch trống và báo giá.
  - name: Bookings
    description: CUSTOMER đặt sân, OWNER xác nhận và hoàn thành.
  - name: Payments
    description: Bản ghi thanh toán của booking đã xác nhận.
  - name: Reviews
    description: Đánh giá gắn với booking COMPLETED của người viết.
  - name: Venue services
    description: Danh mục hàng tiêu hao và dụng cụ cho thuê.
  - name: Booking services
    description: Đặt dịch vụ, giao dụng cụ, check-in và check-out.
  - name: Rental photos
    description: Ảnh nhận và trả dụng cụ. JPEG hoặc PNG, tối đa 5 MiB.
paths:
  /auth/register:
    post:
      operationId: register
      tags:
        - Auth
      summary: Đăng ký CUSTOMER
      description: Chỉ tạo CUSTOMER. Các trường role hoặc id do client gửi bị bỏ qua.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
            example:
              email: customer@example.test
              password: ValidPass123
              fullName: Nguyễn Văn An
              phone: "0901234567"
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          description: Request, định dạng hoặc tham số không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Xung đột với trạng thái, lịch đặt, tồn kho hoặc khóa idempotency hiện tại.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Đăng nhập và nhận access token
      description: Đăng nhập bằng tài khoản đã tạo trong DB. Sao chép data.accessToken vào Authorize. Refresh cookie
        tồn tại 7 ngày.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
            example:
              email: customer@example.test
              password: ValidPass123
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          headers:
            Set-Cookie: &a1
              description: Cookie keosan_refresh, HttpOnly, SameSite=Strict. Secure theo APP_AUTH_SECURE_COOKIE. Trình duyệt
                tự quản lý cookie.
              schema: &a4
                type: string
        "400":
          description: Request, định dạng hoặc tham số không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Thiếu phiên xác thực hợp lệ hoặc thông tin đăng nhập sai.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Đổi access token và refresh cookie
      description: Trình duyệt gửi HttpOnly cookie keosan_refresh. Mỗi lần refresh thay cả access token và refresh
        token. Cập nhật lại Authorize sau thành công.
      security: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          headers:
            Set-Cookie: *a1
        "401":
          description: Thiếu phiên xác thực hợp lệ hoặc thông tin đăng nhập sai.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Thu hồi phiên hiện tại
      description: Nhận bearer token hoặc refresh cookie để thu hồi phiên, xóa cookie. Endpoint cho phép gọi công
        khai. Nếu đang dùng bearer, Swagger vẫn gửi token đã Authorize khi cấu hình security tùy chọn dưới
        đây.
      security:
        - {}
        - bearerAuth: []
      responses:
        "204":
          description: Thành công
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/me:
    get:
      operationId: getMyProfile
      tags:
        - Users
      summary: Đọc hồ sơ của phiên hiện tại
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Thiếu phiên xác thực hợp lệ hoặc thông tin đăng nhập sai.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Không tìm thấy, dữ liệu rỗng theo hành vi endpoint hoặc tài nguyên nằm ngoài quyền truy cập.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateMyProfile
      tags:
        - Users
      summary: Cập nhật tên và số điện thoại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
            example:
              fullName: Nguyễn Văn An
              phone: "0901234567"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          description: Request, định dạng hoặc tham số không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Thiếu phiên xác thực hợp lệ hoặc thông tin đăng nhập sai.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Không tìm thấy, dữ liệu rỗng theo hành vi endpoint hoặc tài nguyên nằm ngoài quyền truy cập.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sport-types:
    get:
      operationId: listSportTypes
      tags:
        - Sport types
      summary: Danh sách môn thể thao
      description: Danh mục rỗng hiện trả 404.
      security: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportType"
        "404":
          description: Không tìm thấy, dữ liệu rỗng theo hành vi endpoint hoặc tài nguyên nằm ngoài quyền truy cập.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createSportType
      tags:
        - Sport types
      summary: ADMIN tạo môn thể thao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportTypeInput"
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportType"
        "400":
          description: Request, định dạng hoặc tham số không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Thiếu phiên xác thực hợp lệ hoặc thông tin đăng nhập sai.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Tên môn thể thao đã tồn tại (SPORT_TYPE_ALREADY_EXISTS) hoặc vi phạm ràng buộc dữ liệu.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sport-types/{id}:
    put:
      operationId: updateSportType
      tags:
        - Sport types
      summary: ADMIN sửa môn thể thao
      parameters:
        - name: id
          in: path
          required: true
          schema: &a2
            type: integer
            format: int64
            minimum: 1
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportTypeInput"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportType"
        "400":
          description: Request, định dạng hoặc tham số không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Thiếu phiên xác thực hợp lệ hoặc thông tin đăng nhập sai.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Không tìm thấy, dữ liệu rỗng theo hành vi endpoint hoặc tài nguyên nằm ngoài quyền truy cập.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Tên môn thể thao đã tồn tại (SPORT_TYPE_ALREADY_EXISTS) hoặc vi phạm ràng buộc dữ liệu.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteSportType
      tags:
        - Sport types
      summary: ADMIN xóa môn thể thao
      description: Trả 409 Conflict (RESOURCE_IN_USE) nếu môn thể thao đang được sân tham chiếu.
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
          example: 1
      responses:
        "204":
          description: Thành công
        "401":
          description: Thiếu phiên xác thực hợp lệ hoặc thông tin đăng nhập sai.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Không tìm thấy, dữ liệu rỗng theo hành vi endpoint hoặc tài nguyên nằm ngoài quyền truy cập.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Không thể xóa vì môn thể thao đang được sân sử dụng (RESOURCE_IN_USE).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /venues:
    get:
      operationId: searchVenues
      tags:
        - Venues
      summary: Tìm cơ sở đang hoạt động
      description: Các điều kiện sân phải cùng khớp một sân. Dùng start và end cho khoảng chính xác, hoặc date cùng
        from/to cho slot bất kỳ trong cửa sổ. Không kết hợp hai kiểu. maxPrice so với giá giờ cơ bản khi không
        lọc thời gian, hoặc giá giờ từng slot khi có lọc. Phân trang từ 0, size tối đa 100, ID tăng dần.
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: district
          in: query
          schema:
            type: string
        - name: sportTypeId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: maxPrice
          in: query
          description: Maximum hourly rate in VND. Includes peak pricing when a time filter is present.
          schema:
            type: number
            minimum: 0
        - name: start
          in: query
          schema:
            $ref: "#/components/schemas/BookingTime"
        - name: end
          in: query
          schema:
            $ref: "#/components/schemas/BookingTime"
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: from
          in: query
          description: Giờ bắt đầu cửa sổ, dạng HH:mm. Chỉ dùng cùng date.
          schema:
            type: string
        - name: to
          in: query
          description: Giờ kết thúc cửa sổ, dạng HH:mm. Chỉ dùng cùng date.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePage"
        "400":
          description: Request, định dạng hoặc tham số không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createVenue
      tags:
        - Venues
      summary: OWNER tạo cơ sở
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueInput"
            example: &a3
              name: Cơ sở thể thao Đặt Sân
              address: 123 Nguyễn Trãi
              district: Thanh Xuân
              city: Hà Nội
              description: Cơ sở thể thao ngoài trời
              openTime: 06:00:00
              closeTime: 23:00:00
              status: ACTIVE
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          description: Request, định dạng hoặc tham số không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Thiếu phiên xác thực hợp lệ hoặc thông tin đăng nhập sai.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Lỗi hệ thống nội bộ không mong muốn (INTERNAL_SERVER_ERROR).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /venues/{id}:
    get:
      operationId: getVenue
      tags:
        - Venues
      summary: Chi tiết cơ sở
      description: Cơ sở ACTIVE công khai. OWNER đã Authorize được xem cơ sở của mình ở trạng thái khác.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
          example: 1
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "404":
          description: Không tìm thấy, dữ liệu rỗng theo hành vi endpoint hoặc tài nguyên nằm ngoài quyền truy cập.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateVenue
      tags:
        - Venues
      summary: OWNER sửa toàn bộ thông tin cơ sở của mình
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueInput"
            example: *a3
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          description: Request, định dạng hoặc tham số không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Thiếu phiên xác thực hợp lệ hoặc thông tin đăng nhập sai.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Vai trò không được phép thao tác hoặc Origin của yêu cầu auth bị từ chối.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Không tìm thấy, dữ liệu rỗng theo hành vi endpoint hoặc tài nguyên nằm ngoài quyền truy cập.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Lỗi hệ thống nội bộ không mong muốn (INTERNAL_SERVER_ERROR).
          content:
            application/problem+json:
