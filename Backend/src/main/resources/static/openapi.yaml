          type: number
        total:
          type: number
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    PhotoPhase:
      enum:
        - CHECK_IN
        - CHECK_OUT
    PhotoAngle:
      enum:
        - OVERVIEW
        - DETAIL
    Photo:
      type: object
      properties:
